{% extends "base.html" %}
{% load static %}
{% block title %}Create your account — TestPilot {% endblock %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-head">
            <h1>Create your account</h1>
            <p>Start testing with TestPilot</p>
        </div>

        <div id="form-message" class="form-message"></div>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>

        <p class="auth-foot">
            Already have an account? <a href="{% url 'login' %}">Log in</a>
        </p>
    </div>
</div>
{% endblock %}
